# Batch skill generation, v1: core OS APIs.
#
# Sources targeted:
#   - glibc manual (https://sourceware.org/glibc/manual/2.43/html_mono/libc.html)
#       File I/O, memory mgmt, processes, sockets, dynamic linker, time, exit.
#   - Apple developer docs (libSystem POSIX surface; Foundation tree deferred)
#   - MSDN Win32 API (kernel32, ntdll, advapi32, ws2_32 — narrowed to non-GUI)
#
# Excluded:
#   - kernel.org core-api: that's KERNEL-INTERNAL API, wrong scope for our
#     user-mode PIC blobs (kmalloc / printk / vfs_read are not callable from
#     userspace).
#   - Apple Foundation deep tree: every framework is its own rabbit hole;
#     add a few via skill_gen one-at-a-time when needed.
#   - Win32 GUI / DirectX / WMI / printing: not what PIC blobs typically need.
#
# To run:
#   docker compose run --rm skill-gen --batch agent/batch/v1_core_apis.yaml
# After it finishes:
#   docker compose run --rm --entrypoint python3 agent /work/tools/gen-seeds-h.py

