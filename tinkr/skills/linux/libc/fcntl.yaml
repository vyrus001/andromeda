name: fcntl
platform: linux
lib: libc
description: |
  Perform one of a family of operations on a file descriptor: duplicate
  it, get/set descriptor flags, get/set file status flags, manage
  advisory record locks, set owner for signal delivery, and more. The
  operation is selected by `cmd`; the meaning and presence of the third
  argument depends on `cmd`.

lowering: indirect_call

seed:
  header: linux_libc
  field: fcntl
  access: "s->libc->fcntl"
  # fcntl is variadic in POSIX — the third argument is absent, an int,
  # or a `struct flock *` depending on cmd. Keep the seed opaque and
  # cast at the call site to the correct typed signature for the cmd.
  type: "void *"

# Informational signature. seeds.h stores this as `void *` (per seed.type
# above). The agent MUST build a typed function pointer per call site
# matching what `cmd` expects.
signature:
  return:
    c_type: int
    on_failure: "returns -1, errno set (note: F_GETFD/F_GETFL return flags >= 0)"
  params:
    - { name: fd,  c_type: int }
    - { name: cmd, c_type: int }
  variadic: true

example: |
  /* Set FD_CLOEXEC on fd. F_GETFD=1, F_SETFD=2, FD_CLOEXEC=1. */
  typedef int (*fcntl_i_t)(int, int, int);
  int flags = ((fcntl_i_t)s->libc->fcntl)(fd, 1, 0);
  if (flags < 0) { /* errno set */ }
  ((fcntl_i_t)s->libc->fcntl)(fd, 2, flags | 1);

  /* Make a non-blocking dup of fd starting at fd>=10.
     F_DUPFD_CLOEXEC=1030 on Linux. */
  int nfd = ((fcntl_i_t)s->libc->fcntl)(fd, 1030, 10);

notes: |
  - fcntl is variadic; the third argument's type depends on `cmd`:
      * int        for F_DUPFD (0), F_DUPFD_CLOEXEC (1030),
                       F_SETFD (2), F_SETFL (4), F_SETOWN (8),
                       F_SETSIG (10), F_SETLEASE (1024),
                       F_NOTIFY (1026), F_SETPIPE_SZ (1031).
      * (none)     for F_GETFD (1), F_GETFL (3), F_GETOWN (9),
                       F_GETSIG (11), F_GETLEASE (1025),
                       F_GETPIPE_SZ (1032).
      * struct flock *  for F_GETLK (5), F_SETLK (6), F_SETLKW (7),
                       and the OFD variants F_OFD_GETLK (36),
                       F_OFD_SETLK (37), F_OFD_SETLKW (38).
    Cast s->libc->fcntl to the matching typed function pointer at the
    call site; do NOT call it through a generic variadic prototype on
    arm64, where the variadic ABI differs from the named-args ABI.
  - Common file-descriptor flags (F_GETFD/F_SETFD): FD_CLOEXEC = 1.
  - Common file-status flags (F_GETFL/F_SETFL): O_NONBLOCK = 0x800,
    O_APPEND = 0x400, O_ASYNC = 0x2000, O_DIRECT = 0x4000. F_SETFL only
    accepts a subset; access mode and O_CREAT-class bits are ignored.
  - For F_GETFD / F_GETFL the return value is the (non-negative) flag
    word on success and -1 on error — check for < 0, not == 0.
  - struct flock layout (Linux, both 32- and 64-bit):
      short l_type; short l_whence; off_t l_start; off_t l_len;
      pid_t l_pid;
    On 32-bit userspace targeting large files, libc transparently uses
    fcntl64; the seed entry handles that, but if you talk to the kernel
    directly you must pick the right cmd numbers.
  - F_SETLKW blocks and is restartable on EINTR; loop on -1/EINTR if
    you don't want signal-driven early returns.
  - OFD locks (F_OFD_*) are associated with the open file description,
    not the PID, and are the right choice for multi-threaded locking.
