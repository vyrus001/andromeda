name: write
platform: linux
lib: syscall
description: |
  Linux write(2) via direct syscall, bypassing libc. The blob carries no
  external symbol dependency for this call — the syscall number is baked
  into the inline asm by the IR emitter at codegen time.

lowering: syscall

# Syscall-style skills do NOT live in the seed struct. The loader does not
# need to populate anything for this skill to work. Architecture matters
# because both the syscall number and the register convention differ.

signature:
  return:
    c_type: long
    on_failure: "negative -errno on error"
  params:
    - { name: fd,    c_type: int }
    - { name: buf,   c_type: "const void *" }
    - { name: count, c_type: "unsigned long" }

arch:
  arm64:
    syscall_number: 64
    helper: |
      static long sys_write(int fd, const void *buf, unsigned long n) {
          register long x0 __asm__("x0") = (long)fd;
          register long x1 __asm__("x1") = (long)buf;
          register long x2 __asm__("x2") = (long)n;
          register long x8 __asm__("x8") = 64;
          __asm__ volatile ("svc #0"
                            : "+r"(x0)
                            : "r"(x1), "r"(x2), "r"(x8)
                            : "memory");
          return x0;
      }
  x86_64:
    syscall_number: 1
    helper: |
      static long sys_write(int fd, const void *buf, unsigned long n) {
          long ret;
          __asm__ volatile ("syscall"
                            : "=a"(ret)
                            : "0"((long)1),
                              "D"((long)fd), "S"(buf), "d"(n)
                            : "rcx", "r11", "memory");
          return ret;
      }

example: |
  long n = sys_write(1, msg, msg_len);
  if (n < 0) { /* errno = -n */ }

notes: |
  - The helper is emitted at file scope by the agent; SheLLVM's flatten
    pass inlines it into the entry function, so it doesn't leak as a
    standalone symbol in the blob.
  - No errno: error returns are negative integers whose absolute value is
    the errno code (e.g., -EFAULT == -14).
  - The agent should select the `arch` block matching the target triple
    of the build. If both could ship, emit both behind #if defined(...).
