name: openat
platform: linux
lib: syscall
description: |
  Open a file relative to a directory file descriptor via direct Linux
  syscall, bypassing libc. On arm64 this is the canonical open primitive
  (there is no plain `open` syscall on arm64). Passing AT_FDCWD as
  `dirfd` makes the path resolve relative to the current working
  directory, matching `open(2)` semantics.

lowering: syscall

signature:
  return:
    c_type: long
    on_failure: "negative -errno on error"
  params:
    - { name: dirfd,    c_type: int }
    - { name: pathname, c_type: "const char *" }
    - { name: flags,    c_type: int }
    - { name: mode,     c_type: "unsigned int" }

arch:
  arm64:
    syscall_number: 56
    helper: |
      static long sys_openat(int dirfd, const char *pathname,
                             int flags, unsigned int mode) {
          register long x0 __asm__("x0") = (long)dirfd;
          register long x1 __asm__("x1") = (long)pathname;
          register long x2 __asm__("x2") = (long)flags;
          register long x3 __asm__("x3") = (long)mode;
          register long x8 __asm__("x8") = 56;
          __asm__ volatile ("svc #0"
                            : "+r"(x0)
                            : "r"(x1), "r"(x2), "r"(x3), "r"(x8)
                            : "memory");
          return x0;
      }
  x86_64:
    syscall_number: 257
    helper: |
      static long sys_openat(int dirfd, const char *pathname,
                             int flags, unsigned int mode) {
          long ret;
          register long r10 __asm__("r10") = (long)flags;
          register long r8  __asm__("r8")  = (long)mode;
          __asm__ volatile ("syscall"
                            : "=a"(ret)
                            : "0"((long)257),
                              "D"((long)dirfd), "S"(pathname),
                              "r"(r10), "r"(r8)
                            : "rcx", "r11", "memory");
          return ret;
      }
  arm:
    syscall_number: 322
    helper: |
      static long sys_openat(int dirfd, const char *pathname,
                             int flags, unsigned int mode) {
          register long r0 __asm__("r0") = (long)dirfd;
          register long r1 __asm__("r1") = (long)pathname;
          register long r2 __asm__("r2") = (long)flags;
          register long r3 __asm__("r3") = (long)mode;
          register long r7 __asm__("r7") = 322;
          __asm__ volatile ("svc #0"
                            : "+r"(r0)
                            : "r"(r1), "r"(r2), "r"(r3), "r"(r7)
                            : "memory");
          return r0;
      }
  i386:
    syscall_number: 295
    helper: |
      static long sys_openat(int dirfd, const char *pathname,
                             int flags, unsigned int mode) {
          long ret;
          __asm__ volatile ("int $0x80"
                            : "=a"(ret)
                            : "0"((long)295),
                              "b"((long)dirfd), "c"(pathname),
                              "d"((long)flags), "S"((long)mode)
                            : "memory");
          return ret;
      }

example: |
  /* AT_FDCWD = -100 makes pathname resolve relative to cwd.
     O_RDONLY = 0, O_WRONLY = 1, O_RDWR = 2.
     O_CREAT = 0x40, O_TRUNC = 0x200, O_CLOEXEC = 0x80000. */
  long fd = sys_openat(-100, "/tmp/data", 0, 0);
  if (fd < 0) { /* errno = -fd */ }

example: |
  /* Create+truncate+write: O_WRONLY|O_CREAT|O_TRUNC = 0x241, mode 0644 = 0420 octal = 0x1A4 */
  long fd = sys_openat(-100, "/tmp/out", 0x241, 0x1A4);

notes: |
  - AT_FDCWD has value -100 on Linux (all architectures). Pass it as
    `dirfd` to get plain-`open(2)` semantics.
  - `mode` is consulted only when O_CREAT or O_TMPFILE is set in `flags`;
    pass 0 otherwise. Mode bits follow standard Unix permissions
    (e.g. 0644 == 0x1A4).
  - Common flags: O_RDONLY=0, O_WRONLY=1, O_RDWR=2, O_CREAT=0x40,
    O_EXCL=0x80, O_TRUNC=0x200, O_APPEND=0x400, O_NONBLOCK=0x800,
    O_DIRECTORY=0x10000, O_CLOEXEC=0x80000. These are Linux values and
    do NOT match macOS.
  - Errors are returned as negative -errno (e.g. -2 == -ENOENT,
    -13 == -EACCES, -17 == -EEXIST). No errno variable is touched.
  - On arm64 Linux there is no plain `open` syscall; this is the only
    direct path. On x86_64 both `open` (2) and `openat` (257) exist; prefer
    openat for portability across architectures.
  - The helper is emitted at file scope and inlined by SheLLVM's flatten
    pass, leaving no standalone symbol in the final blob.
