name: mmap
platform: linux
lib: syscall
description: |
  Map files or anonymous memory into the process address space via direct
  syscall, bypassing libc. The blob carries no external symbol dependency
  for this call — the syscall number is baked into the inline asm at
  codegen time.

lowering: syscall

signature:
  return:
    c_type: "void *"
    on_failure: "negative -errno encoded in the pointer value (check (long)ret < 0 && (long)ret >= -4095)"
  params:
    - { name: addr,   c_type: "void *" }
    - { name: length, c_type: "unsigned long" }
    - { name: prot,   c_type: int }
    - { name: flags,  c_type: int }
    - { name: fd,     c_type: int }
    - { name: offset, c_type: "long long" }

arch:
  arm64:
    syscall_number: 222
    helper: |
      static void *sys_mmap(void *addr, unsigned long length, int prot,
                            int flags, int fd, long long offset) {
          register long x0 __asm__("x0") = (long)addr;
          register long x1 __asm__("x1") = (long)length;
          register long x2 __asm__("x2") = (long)prot;
          register long x3 __asm__("x3") = (long)flags;
          register long x4 __asm__("x4") = (long)fd;
          register long x5 __asm__("x5") = (long)offset;
          register long x8 __asm__("x8") = 222;
          __asm__ volatile ("svc #0"
                            : "+r"(x0)
                            : "r"(x1), "r"(x2), "r"(x3),
                              "r"(x4), "r"(x5), "r"(x8)
                            : "memory");
          return (void *)x0;
      }
  x86_64:
    syscall_number: 9
    helper: |
      static void *sys_mmap(void *addr, unsigned long length, int prot,
                            int flags, int fd, long long offset) {
          long ret;
          register long r10 __asm__("r10") = (long)flags;
          register long r8  __asm__("r8")  = (long)fd;
          register long r9  __asm__("r9")  = (long)offset;
          __asm__ volatile ("syscall"
                            : "=a"(ret)
                            : "0"((long)9),
                              "D"(addr), "S"(length), "d"((long)prot),
                              "r"(r10), "r"(r8), "r"(r9)
                            : "rcx", "r11", "memory");
          return (void *)ret;
      }
  arm:
    syscall_number: 192   # mmap2 — offset is in 4096-byte pages
    helper: |
      static void *sys_mmap(void *addr, unsigned long length, int prot,
                            int flags, int fd, long long offset) {
          /* arm uses mmap2: offset is in PAGE_SIZE (4096) units. */
          register long r0 __asm__("r0") = (long)addr;
          register long r1 __asm__("r1") = (long)length;
          register long r2 __asm__("r2") = (long)prot;
          register long r3 __asm__("r3") = (long)flags;
          register long r4 __asm__("r4") = (long)fd;
          register long r5 __asm__("r5") = (long)(offset >> 12);
          register long r7 __asm__("r7") = 192;
          __asm__ volatile ("swi #0"
                            : "+r"(r0)
                            : "r"(r1), "r"(r2), "r"(r3),
                              "r"(r4), "r"(r5), "r"(r7)
                            : "memory");
          return (void *)r0;
      }
  i386:
    syscall_number: 192   # mmap2 — offset is in 4096-byte pages
    helper: |
      static void *sys_mmap(void *addr, unsigned long length, int prot,
                            int flags, int fd, long long offset) {
          long ret;
          /* i386 mmap2: ebx,ecx,edx,esi,edi,ebp; offset in 4096-byte pages. */
          __asm__ volatile (
              "pushl %%ebp\n\t"
              "movl %7, %%ebp\n\t"
              "int $0x80\n\t"
              "popl %%ebp"
              : "=a"(ret)
              : "0"((long)192),
                "b"(addr), "c"(length), "d"((long)prot),
                "S"((long)flags), "D"((long)fd),
                "r"((long)(offset >> 12))
              : "memory");
          return (void *)ret;
      }

example: |
  void *page = sys_mmap(NULL, 4096,
      /* PROT_READ|PROT_WRITE */ 3,
      /* MAP_PRIVATE|MAP_ANONYMOUS */ 0x22,
      -1, 0);
  if ((long)page < 0 && (long)page >= -4095) { /* errno = -(long)page */ }

notes: |
  - Linux returns errors as small negative pointer values in the range
    [-4095, -1]. Check with `(unsigned long)ret > (unsigned long)-4096`
    or equivalently `(long)ret < 0 && (long)ret >= -4095`. The classic
    MAP_FAILED ((void *)-1) convention is a libc-level translation.
  - PROT_*: PROT_READ=1, PROT_WRITE=2, PROT_EXEC=4, PROT_NONE=0.
  - MAP_* (Linux): MAP_SHARED=1, MAP_PRIVATE=2, MAP_FIXED=0x10,
    MAP_ANONYMOUS=0x20, MAP_GROWSDOWN=0x100, MAP_NORESERVE=0x4000,
    MAP_POPULATE=0x8000, MAP_STACK=0x20000.
  - arm64/x86_64 use the modern `mmap` syscall: offset is in bytes.
  - arm/i386 use `mmap2`: offset is in 4096-byte pages, so the helper
    shifts the byte offset right by 12. This loses sub-page granularity,
    which is fine for page-aligned mappings.
  - i386 has six arg slots but only five GPRs for syscalls, so the 6th
    argument goes through EBP; the helper saves/restores it.
  - For MAP_ANONYMOUS mappings, `fd` should be -1 and `offset` 0.
  - The helper is emitted at file scope by the agent; SheLLVM's flatten
    pass inlines it into the entry function so no standalone symbol
    leaks into the blob.
