name: NtCreateFile
platform: windows
lib: ntdll
description: |
  Native API for creating or opening a file, directory, device, or
  pseudo-file. Lower-level counterpart to CreateFileW; takes paths as
  UNICODE_STRING wrapped in an OBJECT_ATTRIBUTES, and returns an
  NTSTATUS plus an IO_STATUS_BLOCK describing what actually happened
  (created vs opened, etc.). Preferred over kernel32!CreateFileW when
  minimising import dependencies or when needing NT-namespace paths
  (e.g. "\\??\\C:\\foo" or "\\Device\\...").

lowering: indirect_call

seed:
  header: windows_ntdll
  field: NtCreateFile
  access: "s->ntdll->NtCreateFile"

# Typed NT names → portable C:
#   NTSTATUS                  -> int
#   PHANDLE                   -> void **
#   ACCESS_MASK               -> unsigned int
#   POBJECT_ATTRIBUTES        -> void *   (opaque; agent builds the struct)
#   PIO_STATUS_BLOCK          -> void *   (opaque; { NTSTATUS; ULONG_PTR; })
#   PLARGE_INTEGER            -> long long *
#   ULONG                     -> unsigned int
#   PVOID                     -> void *
signature:
  return:
    c_type: int
    on_failure: "NTSTATUS != 0 indicates failure; no GetLastError translation"
  params:
    - { name: FileHandle,        c_type: "void **" }
    - { name: DesiredAccess,     c_type: "unsigned int" }
    - { name: ObjectAttributes,  c_type: "void *" }
    - { name: IoStatusBlock,     c_type: "void *" }
    - { name: AllocationSize,    c_type: "long long *" }
    - { name: FileAttributes,    c_type: "unsigned int" }
    - { name: ShareAccess,       c_type: "unsigned int" }
    - { name: CreateDisposition, c_type: "unsigned int" }
    - { name: CreateOptions,     c_type: "unsigned int" }
    - { name: EaBuffer,          c_type: "void *" }
    - { name: EaLength,          c_type: "unsigned int" }

example: |
  /* Open "\??\C:\test.txt" for read; NT paths require the "\??\" prefix. */
  static const unsigned short path[] = {
      '\\','?','?','\\','C',':','\\','t','e','s','t','.','t','x','t', 0
  };

  struct unicode_string { unsigned short Length, MaximumLength; unsigned short *Buffer; };
  struct object_attributes {
      unsigned int Length;
      void *RootDirectory;
      struct unicode_string *ObjectName;
      unsigned int Attributes;
      void *SecurityDescriptor;
      void *SecurityQualityOfService;
  };
  struct io_status_block { int Status; unsigned long long Information; };

  struct unicode_string us = {
      .Length = sizeof(path) - 2,        /* bytes, excluding NUL */
      .MaximumLength = sizeof(path),
      .Buffer = (unsigned short *)path,
  };
  struct object_attributes oa = {
      .Length = sizeof(oa),
      .RootDirectory = NULL,
      .ObjectName = &us,
      .Attributes = 0x40,                /* OBJ_CASE_INSENSITIVE */
      .SecurityDescriptor = NULL,
      .SecurityQualityOfService = NULL,
  };
  struct io_status_block iosb = {0};
  void *h = NULL;

  /* FILE_GENERIC_READ = 0x120089, FILE_SHARE_READ = 1,
     FILE_OPEN = 1, FILE_SYNCHRONOUS_IO_NONALERT = 0x20,
     SYNCHRONIZE = 0x100000 (must be OR'd into DesiredAccess for sync I/O). */
  int status = s->ntdll->NtCreateFile(
      &h,
      0x120089 | 0x100000,
      &oa,
      &iosb,
      NULL,              /* AllocationSize */
      0x80,              /* FILE_ATTRIBUTE_NORMAL */
      1,                 /* FILE_SHARE_READ */
      1,                 /* FILE_OPEN */
      0x20,              /* FILE_SYNCHRONOUS_IO_NONALERT */
      NULL, 0);

notes: |
  - Paths use the NT object namespace, NOT Win32. Prefix Win32 drive
    paths with "\\??\\" (e.g. "\\??\\C:\\foo\\bar.txt"). Forward
    slashes are not translated; use backslashes.
  - ObjectAttributes is a caller-built struct; the agent must emit a
    `struct object_attributes` declaration plus a `struct unicode_string`
    for the path. The Length field of UNICODE_STRING is in BYTES, not
    code units, and EXCLUDES the trailing NUL.
  - IoStatusBlock receives the result: iosb.Status mirrors the NTSTATUS
    return, iosb.Information says what happened (FILE_CREATED=2,
    FILE_OPENED=1, FILE_OVERWRITTEN=3, FILE_SUPERSEDED=0, FILE_EXISTS=4,
    FILE_DOES_NOT_EXIST=5).
  - CreateDisposition values differ from kernel32!CreateFileW:
    FILE_SUPERSEDE=0, FILE_OPEN=1, FILE_CREATE=2, FILE_OPEN_IF=3,
    FILE_OVERWRITE=4, FILE_OVERWRITE_IF=5.
  - For synchronous I/O (the common case), OR `SYNCHRONIZE` (0x100000)
    into DesiredAccess and set FILE_SYNCHRONOUS_IO_NONALERT (0x20) or
    FILE_SYNCHRONOUS_IO_ALERT (0x10) in CreateOptions. Otherwise reads
    and writes via NtReadFile/NtWriteFile require event objects.
  - Other useful CreateOptions: FILE_DIRECTORY_FILE=1, FILE_NON_DIRECTORY_FILE=0x40,
    FILE_NO_INTERMEDIATE_BUFFERING=8, FILE_WRITE_THROUGH=2,
    FILE_DELETE_ON_CLOSE=0x1000.
  - Win64 ABI: first four args in RCX/RDX/R8/R9, the remaining seven
    spill to the stack after the 32-byte shadow space. Clang handles
    this with --target=x86_64-pc-windows-*.
  - On failure, *FileHandle is set to NULL and no handle needs closing.
    On success, close via NtClose (ntdll) or CloseHandle (kernel32).
