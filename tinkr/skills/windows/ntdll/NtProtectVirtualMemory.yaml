name: NtProtectVirtualMemory
platform: windows
lib: ntdll
description: |
  Native API counterpart to VirtualProtect. Changes protection on a
  region of committed pages.

lowering: indirect_call

seed:
  header: windows_ntdll
  field: NtProtectVirtualMemory
  access: "s->ntdll->NtProtectVirtualMemory"

signature:
  return:
    c_type: int
    on_failure: "NTSTATUS != 0 indicates failure"
  params:
    - { name: ProcessHandle,           c_type: "void *" }
    - { name: BaseAddress,             c_type: "void **" }
    - { name: NumberOfBytesToProtect,  c_type: "size_t *" }
    - { name: NewAccessProtection,     c_type: "unsigned int" }
    - { name: OldAccessProtection,     c_type: "unsigned int *" }

example: |
  void *base = code;
  size_t size = code_size;
  unsigned int old;
  s->ntdll->NtProtectVirtualMemory((void *)-1, &base, &size, /* PAGE_EXECUTE_READ */ 0x20, &old);

notes: |
  - Same PAGE_* constants as VirtualProtect.
  - BaseAddress and NumberOfBytesToProtect are in/out — rounded to page
    boundaries on return.
  - OldAccessProtection MUST point to a writable DWORD; cannot be NULL.
