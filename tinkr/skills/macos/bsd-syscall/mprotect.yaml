name: mprotect
platform: macos
lib: bsd-syscall
description: |
  Change the protection on a region of the process's virtual address
  space via the BSD-class syscall directly, bypassing libSystem. The
  region [addr, addr+len) must be page-aligned; protection is one or
  more of PROT_NONE/READ/WRITE/EXEC.

lowering: syscall

signature:
  return:
    c_type: long
    on_failure: "negative -errno on error (carry-flag converted by helper)"
  params:
    - { name: addr, c_type: "void *" }
    - { name: len,  c_type: "unsigned long" }
    - { name: prot, c_type: int }

arch:
  arm64:
    syscall_number: 74    # SYS_mprotect
    helper: |
      static long sys_mprotect(void *addr, unsigned long len, int prot) {
          register long x0  __asm__("x0")  = (long)addr;
          register long x1  __asm__("x1")  = (long)len;
          register long x2  __asm__("x2")  = (long)prot;
          register long x16 __asm__("x16") = 74;   /* SYS_mprotect */
          __asm__ volatile (
              "svc #0x80\n\t"
              "b.cc 1f\n\t"
              "neg x0, x0\n"   /* on error: x0 = errno -> -errno */
              "1:"
              : "+r"(x0)
              : "r"(x1), "r"(x2), "r"(x16)
              : "cc", "memory"
          );
          return x0;
      }
  x86_64:
    syscall_number: 74    # SYS_mprotect; BSD class encoded in upper bits.
    helper: |
      static long sys_mprotect(void *addr, unsigned long len, int prot) {
          long ret;
          __asm__ volatile (
              "syscall\n\t"
              "jnc 1f\n\t"
              "negq %%rax\n"   /* on error: rax = errno -> -errno */
              "1:"
              : "=a"(ret)
              : "0"((long)0x200004A),   /* (BSD class << 24) | SYS_mprotect (74=0x4A) */
                "D"(addr), "S"(len), "d"((long)prot)
              : "rcx", "r11", "cc", "memory"
          );
          return ret;
      }

example: |
  /* Flip a freshly-mmap'd RW page to RX. */
  long rc = sys_mprotect(page, 4096, /* PROT_READ|PROT_EXEC */ 5);
  if (rc < 0) { /* errno = -rc */ }

notes: |
  - macOS syscalls indicate failure via the carry flag, not via the
    sign of the return value (unlike Linux). The helper normalises to
    the Linux-style "negative = -errno" convention.
  - On x86_64 macOS the syscall number embeds the BSD class in the
    upper byte: SYS_mprotect = 74 (0x4A), encoded as 0x200004A.
  - PROT_NONE=0, PROT_READ=1, PROT_WRITE=2, PROT_EXEC=4 on macOS
    (same numeric values as Linux, but document them here because the
    blob has no headers).
  - `addr` and `len` must be page-aligned (page size = 16384 on Apple
    Silicon, 4096 on Intel). Misalignment returns -EINVAL.
  - Hardened-runtime processes on Apple Silicon CANNOT flip a page to
    PROT_EXEC unless it was mmap'd with MAP_JIT (0x800) AND the
    binary has the com.apple.security.cs.allow-jit entitlement; the
    syscall will return -EACCES otherwise. JIT pages additionally
    require pthread_jit_write_protect_np() to toggle W^X state.
  - Apple discourages direct syscalls; numbers occasionally change
    across macOS versions. Prefer macos/libSystem/mprotect
    (indirect_call) for long-lived tooling.
