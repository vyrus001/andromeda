name: lseek
platform: macos
lib: bsd-syscall
description: |
  Reposition the read/write offset of an open file descriptor via the
  BSD-class syscall directly, bypassing libSystem. Returns the resulting
  absolute offset from the start of the file on success.

lowering: syscall

signature:
  return:
    c_type: long long
    on_failure: "negative -errno on error (carry-flag converted by helper)"
  params:
    - { name: fd,     c_type: int }
    - { name: offset, c_type: "long long" }
    - { name: whence, c_type: int }

arch:
  arm64:
    syscall_number: 199   # SYS_lseek
    helper: |
      static long long sys_lseek(int fd, long long offset, int whence) {
          register long x0  __asm__("x0")  = (long)fd;
          register long x1  __asm__("x1")  = (long)offset;
          register long x2  __asm__("x2")  = (long)whence;
          register long x16 __asm__("x16") = 199;  /* SYS_lseek */
          __asm__ volatile (
              "svc #0x80\n\t"
              "b.cc 1f\n\t"
              "neg x0, x0\n"   /* on error: x0 = errno -> -errno */
              "1:"
              : "+r"(x0)
              : "r"(x1), "r"(x2), "r"(x16)
              : "cc", "memory"
          );
          return (long long)x0;
      }
  x86_64:
    syscall_number: 199   # SYS_lseek; encoded as 0x2000000 | 199 = 0x20000C7
    helper: |
      static long long sys_lseek(int fd, long long offset, int whence) {
          long long ret;
          __asm__ volatile (
              "syscall\n\t"
              "jnc 1f\n\t"
              "negq %%rax\n"   /* on error: rax = errno -> -errno */
              "1:"
              : "=a"(ret)
              : "0"((long long)0x20000C7),  /* (BSD class << 24) | SYS_lseek */
                "D"((long long)fd), "S"(offset), "d"((long long)whence)
              : "rcx", "r11", "cc", "memory"
          );
          return ret;
      }

example: |
  long long pos = sys_lseek(fd, 0, /* SEEK_END */ 2);
  if (pos < 0) { /* errno = -pos */ }

notes: |
  - whence values on macOS: SEEK_SET=0 (absolute), SEEK_CUR=1 (relative
    to current offset), SEEK_END=2 (relative to end-of-file). Newer
    macOS also defines SEEK_HOLE=3 and SEEK_DATA=4 for sparse files.
  - macOS lseek is natively 64-bit (off_t is always 64-bit on Darwin);
    there is no separate `lseek64`. Both arm64 and x86_64 pass the
    64-bit offset in a single register.
  - macOS syscalls indicate failure via the carry flag, not via the
    sign of the return value. The helper normalises to the Linux-style
    "negative = -errno" convention.
  - On x86_64 macOS the syscall number embeds the BSD class in the
    upper byte: SYS_lseek = 199, encoded as 0x20000C7.
  - Not all file descriptors are seekable; pipes, sockets, and some
    character devices return -ESPIPE (-29 on macOS).
  - Apple discourages direct syscalls; numbers occasionally change
    across macOS versions. Prefer macos/libSystem/lseek (indirect_call)
    for long-lived tooling.
