name: recv
platform: macos
lib: libSystem
description: |
  Receive data from a connected socket into `buf`, up to `len` bytes.
  For connectionless sockets, the socket must still have a default peer
  set (via connect) or you should use recvfrom instead. Resolves at
  load-time through the seed struct.

lowering: indirect_call

seed:
  header: macos_libsystem
  field: recv
  access: "s->libsystem->recv"

signature:
  return:
    c_type: long
    on_failure: "returns -1, errno set; returns 0 on orderly peer shutdown"
  params:
    - { name: sockfd, c_type: int }
    - { name: buf,    c_type: "void *" }
    - { name: len,    c_type: size_t }
    - { name: flags,  c_type: int }

example: |
  char buf[1024];
  long n = s->libsystem->recv(sockfd, buf, sizeof(buf), 0);
  if (n < 0) { /* errno set */ }
  else if (n == 0) { /* peer closed connection */ }

notes: |
  - Return type is ssize_t (signed long on macOS LP64); we use `long`
    to keep seeds.h free of <sys/types.h>.
  - A return of 0 on a stream socket (SOCK_STREAM) means the peer has
    performed an orderly shutdown — it is NOT an error.
  - Common `flags` (macOS values): MSG_OOB=0x1, MSG_PEEK=0x2,
    MSG_DONTROUTE=0x4, MSG_DONTWAIT=0x80, MSG_WAITALL=0x40. Pass 0 for
    default behaviour.
  - With MSG_DONTWAIT (or O_NONBLOCK on the fd), a would-block condition
    returns -1 with errno=EAGAIN/EWOULDBLOCK (35 on macOS).
  - For datagram sockets you usually want recvfrom to also get the
    source address; recv discards it.
  - Equivalent to read(2) on a socket when flags==0, but recv allows
    flag bits that read does not.
