<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soldir</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <svg id="graph" role="img" aria-label="Tailor instance graph"></svg>

      <section class="hud" aria-label="Graph controls">
        <div class="brand">SOLDIR</div>
        <div class="status">
          <span id="socketDot" class="dot offline"></span>
          <span id="socketText">offline</span>
        </div>
        <button id="fitGraph" class="hud-button" type="button" title="Fit graph">FIT</button>
      </section>

      <aside class="legend" aria-label="Edge legend">
        <div><span class="sample sample-comm"></span>has communicated with</div>
        <div><span class="sample sample-reach"></span>is reachable by</div>
      </aside>

      <aside id="nodePanel" class="node-panel" aria-live="polite"></aside>

      <footer class="chat-strip" aria-label="Agent chat">
        <div id="chatOutput" class="chat-output">No messages yet.</div>
        <form id="chatForm" class="chat-form">
          <select id="provider" title="Provider">
            <option value="grok">grok</option>
            <option value="openai">openai</option>
            <option value="claude">claude</option>
            <option value="ollama">ollama</option>
          </select>
          <input id="model" title="Model" autocomplete="off" />
          <textarea id="message" rows="2" placeholder="Ask about the graph"></textarea>
          <button id="sendMessage" type="submit" title="Send">SEND</button>
        </form>
      </footer>
    </main>
    <script src="/vendor/d3/d3.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
