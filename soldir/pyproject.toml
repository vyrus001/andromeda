[project]
name = "soldir"
version = "0.1.0"
description = "Realtime check-in graph, Tinkr orchestration, and agentic chat front end for Tailor instances."
requires-python = ">=3.9"
dependencies = [
  "eval-type-backport>=0.2.0",
  "fastapi>=0.115",
  "graphqlite>=0.4.4",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
soldir = "soldir.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["soldir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
